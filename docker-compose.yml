services:
  api:
    build: .
    container_name: product-ai-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://product_ai_user:product_ai_password@postgres:5432/product_ai
      MODEL_PATH: models/steel_defect_yolo11n_v1.pt
      MODEL_VERSION: steel-defect-yolo11n-v1
      CONFIDENCE_THRESHOLD: "0.25"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: product-ai-postgres
    environment:
      POSTGRES_DB: product_ai
      POSTGRES_USER: product_ai_user
      POSTGRES_PASSWORD: product_ai_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_ai_user -d product_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: product-ai-ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000/predict
    depends_on:
      - api